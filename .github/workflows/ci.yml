name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
          pip install .

      - name: Verify compilation
        run: |
          python -m compileall TwitchChannelPointsMiner setup.py example.py pickle_view.py

      - name: Verify package import
        run: |
          python -c "import TwitchChannelPointsMiner; print(f'Version: {TwitchChannelPointsMiner.__version__}')"

      - name: Lint with flake8
        run: |
          flake8 . --exclude=.git,build,dist,__pycache__ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 TwitchChannelPointsMiner --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  docker-smoke-test:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
